.banner:before{display:none}.campaign h1{font-style:italic;text-shadow:0 2px 10px #000}.campaign h1 em{font-style:inherit;text-shadow:0 0 .85rem #ef651d50}
.count{background:linear-gradient(145deg,#10151af5,#101010f0);border-color:#f3854b96;box-shadow:inset 0 0 .7rem #ec722018,0 0 1.15rem #ef731c33}
.team{position:relative;isolation:isolate;box-shadow:inset 0 0 1.15rem var(--glow),0 0 .75rem var(--glow)}
.team:after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse 44% 9% at 100% 100%,var(--glow),transparent),radial-gradient(ellipse 33% 6% at 10% 0,var(--glow),transparent)}
.teamhead{position:relative;background:linear-gradient(105deg,var(--glow),#0a131c 66%,var(--glow))}.teamhead:after{content:'';position:absolute;bottom:-1px;left:6%;width:64%;height:2px;background:linear-gradient(90deg,transparent,var(--edge),#fff,var(--edge),transparent);box-shadow:0 0 .42rem var(--edge)}
.teamhead:before{filter:drop-shadow(0 0 .4rem var(--edge))}.medal{border-radius:50%;mask-image:radial-gradient(circle,#000 57%,#000d 67%,transparent 75%);-webkit-mask-image:radial-gradient(circle,#000 57%,#000d 67%,transparent 75%);width:4.8rem}.portrait{width:4.35rem}.first .portrait{box-shadow:0 0 .8rem var(--glow),0 0 .2rem var(--edge)}
.sales strong{font-size:1.85rem;letter-spacing:-.055em}.who{font-size:1.34rem}.first .sales strong{color:#fff5eb}
.track{background:#27313b;box-shadow:inset 0 1px .16rem #0008}.track>b{background:linear-gradient(90deg,#da4e13,#f36f21 70%,#ffac66);box-shadow:0 0 .6rem #f36f2155,inset 0 1px 0 #ffc79a77}
.mini{background:#27343f}.mini i{background:linear-gradient(90deg,#537285,#93b4ca)}.mix:has(.open) .mini i{background:linear-gradient(90deg,#068d65,#35dea4);box-shadow:0 0 .45rem #16c58955}
.lock.open{box-shadow:0 0 .6rem #15da9455}.bonus.on{background:radial-gradient(ellipse at 50% 0,#14603f,#08271e 78%);border:1px solid #4be5a6;box-shadow:inset 0 0 .8rem #3bf39d24,0 0 .8rem #23db8433}.bonus.on .ico{filter:drop-shadow(0 0 .24rem #6bffc9)}.bonus.on b{text-shadow:0 0 .55rem #76ffad66}
@media(prefers-reduced-motion:no-preference){.track>b,.mini i{animation:fill-score 1.35s cubic-bezier(.18,.77,.22,1) backwards;transition:none}@keyframes fill-score{from{width:var(--from,0%)}}}
@media(max-width:760px) and (orientation:portrait){.portrait,.medal{width:2.8rem}.sales strong{font-size:1.25rem}}

.sales-meter{position:relative;padding-bottom:1.15rem}
.sales-meter .track{overflow:visible}.sales-meter .track>.animated-fill{position:relative;width:var(--end);height:100%;overflow:visible;border-radius:inherit;background:linear-gradient(180deg,#ffc481,#ff9844 24%,#f36f21 64%,#db5818);box-shadow:inset 0 1px 0 #ffdfb887;transition:none;animation:none}
.sales-meter .animated-fill.lit:after{content:'';position:absolute;inset:0 0 0 auto;width:min(100%,.65rem);border-radius:0 1rem 1rem 0;background:linear-gradient(90deg,transparent,#ffd59c);box-shadow:.18rem 0 .7rem #ff9c49ad}
.sales-meter .target{right:0;height:155%;top:-27%;background:#fff;z-index:1}
.threshold-label{position:absolute;right:0;bottom:0;color:#dce3eb;white-space:nowrap;font:600 .72rem/1.2 'Segoe UI',sans-serif}
.card .mix{margin-top:.48rem}.next.near{display:inline-block;padding:.24rem .55rem;border:1px solid #f39547;border-radius:.45rem;color:#fff0d8;background:#302015;font-weight:700;box-shadow:0 0 .6rem #f36f2126}
.excess{display:block;margin-top:.4rem;color:#ffae64;font-size:.94rem;letter-spacing:-.02em}
@media(min-width:761px){.card .identity{display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;gap:.35rem .7rem}.card .medal{grid-row:span 2}.card .portrait{justify-self:center;width:4.65rem}.card .who{text-align:center;font-size:1.44rem}}
@media(prefers-reduced-motion:no-preference){
.sales-meter .track>.animated-fill{animation:growScore 2.3s cubic-bezier(.25,.72,.27,1) var(--delay) backwards}
@keyframes growScore{from{width:var(--start)}to{width:var(--end)}}
.bonus.on.ignite{animation:igniteBonus .85s ease-out var(--ignite-delay,0s) backwards}
@keyframes igniteBonus{0%{border-color:#40504d;background:#141a19;color:#94a4a0;box-shadow:none}65%{border-color:#c2ffe1;box-shadow:0 0 1.4rem #45ee9c9c,inset 0 0 .6rem #45ee9c42}100%{border-color:#4be5a6;box-shadow:inset 0 0 .8rem #3bf39d24,0 0 .8rem #23db8433}}
}

/* Halo ancorado no limite do faturamento de cada pessoa. */
.sales-meter .animated-fill.lit::before {
 content:'';position:absolute;top:50%;right:0;width:.86rem;height:1.1rem;
 border-radius:50%;background:radial-gradient(ellipse,#fff1cdbf 0%,#ffb5658a 24%,#ff782b24 56%,transparent 75%);
 pointer-events:none;transform:translate(50%,-50%);opacity:.65
}
@media(prefers-reduced-motion:no-preference){
 .sales-meter .animated-fill.lit::before{
  animation:pulseRevenueTip 2.6s ease-in-out infinite;animation-delay:var(--delay,0s)
 }
 @keyframes pulseRevenueTip{
  0%,100%{transform:translate(50%,-50%) scale(.78);opacity:.45}
  52%{transform:translate(50%,-50%) scale(1.95,1.45);opacity:1}
 }

const MAPA = { tabela_vendas:'vendas', coluna_id:'id', coluna_valor:'valor',
  coluna_vendedor:'vendedor', coluna_prevendedor:'prevendedor', coluna_pagamento:'pagamento',
  coluna_data:'data_venda', coluna_status:'status' };
const STATUS_VALIDOS = ['Concluída']; // Grafia exata do CRM. Apenas vendas confirmadas.
const FORMAS_VALIDAS = ['Santander','BV','À Vista 100%','Cartão 100%'];
const META_INDIVIDUAL = 120000;
const PERCENTUAL_EXTRA = 60;

const FIM_EXCLUSIVO = '2026-12-01T00:00:00-03:00'; // Inclui todo o minuto 23:59 de 30/11 em Belém.
const EQUIPES = [
  {titulo:'Vendedores', campo:'vendedor', base:500, extra:300, participantes:['Victor','Daniel']},
  {titulo:'Pré-vendedores', campo:'prevendedor', base:250, extra:150, participantes:['Giovana','Marcela','David']}
]; // Somente estes nomes entram no ranking, inclusive com valor zero.
// FIM DA CONFIGURAÇÃO
const $ = id => document.getElementById(id);
const moeda = (v,casas=0) => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:casas,maximumFractionDigits:casas});
const valor = centavos => moeda(centavos/100, centavos%100 ? 2 : 0);
const normal = s => String(s??'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ');
const validas = new Set(FORMAS_VALIDAS.map(normal));
const esc = v => String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const porcento = n => (Math.floor(n*10)/10).toLocaleString('pt-BR')+'%';
const limite = n => Math.max(0,Math.min(100,n));
function exemplo(){
 const linhas=[
 ['Victor','Giovana',78000,'Santander'],['Victor','Marcela',54000,'BV'],['Victor','David',21500,'Entrada + parcelas'],
 ['Daniel','Giovana',52200,'Outro'],['Daniel','Marcela',48600,'Cartão 100%'],['Daniel','David',24000,'Outro']];
 return linhas.map(([vendedor,prevendedor,reais,pagamento])=>({vendedor,prevendedor,reais,pagamento}));
}
function consolidar(linhas){
 const listas=EQUIPES.map(()=>new Map());
 function pessoa(mapa,nome){
   const chave=normal(nome); if(!chave)return null;
   if(!mapa.has(chave))mapa.set(chave,{nome:String(nome).trim(),total:0,qual:0});
   return mapa.get(chave);
 }
 EQUIPES.forEach((e,i)=>e.participantes.forEach(n=>pessoa(listas[i],n)));
 let total=0;
 for(const venda of linhas){
   if(venda.reais==null || String(venda.reais).trim()==='')throw Error('Valor de venda ausente');
   const centavos=Math.round(Number(venda.reais)*100);
   if(!Number.isSafeInteger(centavos)||centavos<0)throw Error('Valor de venda inválido');
   total+=centavos;
   EQUIPES.forEach((e,i)=>{const p=listas[i].get(normal(venda[e.campo]));if(p){p.total+=centavos;if(validas.has(normal(venda.pagamento)))p.qual+=centavos;}});
 }
 return {total,grupos:listas.map(m=>[...m.values()].sort((a,b)=>b.total-a.total||b.qual-a.qual||a.nome.localeCompare(b.nome,'pt-BR')))};
}

function card(p,pos,e){
 const meta=p.total/META_INDIVIDUAL, mix=p.total?100*p.qual/p.total:0;
 const nivel=nivelBonus(p), qual=p.total>0 && p.qual*100>=PERCENTUAL_EXTRA*p.total;
 const saldo=p.total-META_INDIVIDUAL*100;
 let objetivo;
 if(saldo<0) objetivo='Faltam '+valor(-saldo)+' para atingir a meta';
 else if(nivel===1){
   // Cada nova venda válida aumenta tanto o valor qualificado quanto o total vendido.
   const faltaValida=Math.ceil((PERCENTUAL_EXTRA*p.total-100*p.qual)/(100-PERCENTUAL_EXTRA));
   objetivo='Venda mais '+valor(faltaValida)+' nas formas válidas para liberar '+moeda(e.extra);
 }else objetivo='Bônus completo · '+moeda(e.base+e.extra);
 const iniciais=p.nome.split(/\s+/).filter((_,i,a)=>i===0||i===a.length-1).map(s=>[...s][0]).join('').toUpperCase();
 function selo(quantia,ativo,extra){
   const path=ativo?(extra?'M8 10V7a4 4 0 0 1 8 0 M6 10h12v10H6z':'m4 12 5 5L20 6'):'M8 10V7a4 4 0 0 1 8 0v3 M6 10h12v10H6z';
   return `<span class="bonus ${ativo?'on':''} ${ativo && anterior.nivel<(extra?2:1)?'ignite':''}" style="--ignite-delay:${pos*.19+1.85+(extra ? .35 : 0)}s"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="${path}"/></svg><span><b>${moeda(quantia)}</b><small>${ativo?(extra?'Destravado':'Liberado'):'Bloqueado'}</small></span></span>`;
 }
 const foto=FOTOS_EQUIPE[p.nome] || (MODO_TESTE && RETRATOS_DEMO[p.nome]);
 const id=e.campo+'|'+p.nome;
 const anterior=barrasAnteriores.get(id)||{meta:0,mix:0,nivel:0};
 const larguraMeta=limite(meta), larguraMix=limite(mix*100/PERCENTUAL_EXTRA);
 barrasAnteriores.set(id,{meta:larguraMeta,mix:larguraMix,nivel});
 return `<article class="card ${pos===0?'first':''}">
   <div class="identity"><span class="medal m${pos+1}" aria-label="${pos+1}º lugar"><b>${pos+1}º</b></span><span class="portrait">${foto?'<img src="'+esc(foto)+'" alt="">':esc(iniciais)}</span><h3 class="who">${esc(p.nome)}</h3></div>
   <div class="performance"><span class="cap">Faturamento atual</span><div class="sales"><strong>${valor(p.total)}</strong><span>${porcento(meta)}</span></div>
   <div class="sales-meter" style="--delay:${pos*.19}s">
     <div class="track" title="Meta individual: R$ 120 mil"><b class="animated-fill ${larguraMeta>0?'lit':''}" style="--start:${anterior.meta}%;--end:${larguraMeta}%"></b><i class="target"></i></div>
     <span class="threshold-label">100% da meta</span></div>
   ${saldo<0?`<strong class="remaining">${objetivo}</strong>`:""}
   <div class="mix"><span class="lock ${qual?'open':''}" aria-hidden="true"></span><div><b>${porcento(mix)} qualificado</b><div class="mini"><i style="--from:${anterior.mix}%;width:${larguraMix}%"></i></div></div></div>
   ${saldo>=0?`<small class="next ${nivel===1 && mix>=55?'near':''}">${objetivo}</small>`:""}${saldo>0?'<strong class="excess">+ '+valor(saldo)+' acima da meta</strong>':''}</div>
   <div class="bonuses">${selo(e.base,nivel>=1,false)}${selo(e.extra,nivel===2,true)}</div>
 </article>`;
}

function capacidade(){
 if(innerWidth<=760)return 5;
 const rem=parseFloat(getComputedStyle(document.documentElement).fontSize);
 return Math.max(1,Math.min(4,Math.floor(($('lista0').clientHeight+.48*rem)/(7.2*rem))));
}
function pintar(){
 if(!dados)return;
 const tam=capacidade();
 dados.grupos.forEach((grupo,i)=>{
 const max=Math.max(1,Math.ceil(grupo.length/tam));paginas[i]%=max;
 const ini=paginas[i]*tam, lista=$('lista'+i);
 lista.style.gridTemplateRows='repeat('+Math.max(1,Math.min(tam,grupo.length))+', minmax(0,1fr))';
 if(innerWidth<=760)lista.style.gridTemplateRows='none';
 lista.innerHTML=grupo.slice(ini,ini+tam).map((p,j)=>card(p,ini+j,EQUIPES[i])).join('')||'<div class="empty">Nenhuma venda confirmada no período.</div>';
 $('nav'+i).innerHTML=max>1?'<button data-dir="-1" aria-label="Página anterior">‹</button> '+(paginas[i]+1)+'/'+max+' <button data-dir="1" aria-label="Próxima página">›</button>':'';
 $('nav'+i).onclick=ev=>{if(ev.target.dataset.dir){paginas[i]=(paginas[i]+Number(ev.target.dataset.dir)+max)%max;pintar();}};
 });

function nivelBonus(p){
 if(p.total<META_INDIVIDUAL*100)return 0;
 return p.qual*100>=PERCENTUAL_EXTRA*p.total?2:1;
}
const filaPremios=[];
let celebrando=false;
function exibirPremio(){
 if(celebrando||!filaPremios.length)return;
 celebrando=true;
 const {nome,quantia,extra,teste}=filaPremios.shift();
 $('awardType').textContent=teste?'Prévia da celebração':extra?'Bônus extra destravado':'Meta alcançada';
 $('awardName').textContent=nome;
 $('awardValue').textContent=moeda(quantia)+' em bônus '+(extra?'extra':'liberado');
 $('celebration').hidden=false;
 setTimeout(()=>{$('celebration').hidden=true;celebrando=false;exibirPremio();},4500);
}
function detectarPremios(antes,depois){
 depois.grupos.forEach((grupo,i)=>{

 for(const p of grupo){
 const atual=nivelBonus(p), anterior=anteriores.get(p.nome)??0;
 for(let nivel=anterior+1;nivel<=atual;nivel++){
 const extra=nivel===2;
 filaPremios.push({nome:p.nome,extra,quantia:extra?EQUIPES[i].extra:EQUIPES[i].base});
 }
 }
 });
 exibirPremio();
}

async function lerVendas(){
 const m=MAPA, campos=[m.coluna_id,m.coluna_valor,m.coluna_vendedor,m.coluna_prevendedor,m.coluna_pagamento];
 const fim=new Date(Math.min(Date.now()+1,Date.parse(FIM_EXCLUSIVO))).toISOString();
 const linhas=[];let ultimo;
 for(;;){
 let q=cliente.from(m.tabela_vendas).select([...new Set(campos)].join(',')).gte(m.coluna_data,INICIO).lt(m.coluna_data,fim).in(m.coluna_status,STATUS_VALIDOS).order(m.coluna_id,{ascending:true}).limit(500);
 if(ultimo!==undefined)q=q.gt(m.coluna_id,ultimo);
 const {data,error}=await q;if(error)throw error;if(!data.length)break;
 for(const r of data)linhas.push({reais:r[m.coluna_valor],vendedor:r[m.coluna_vendedor],prevendedor:r[m.coluna_prevendedor],pagamento:r[m.coluna_pagamento]});
 const novo=data[data.length-1][m.coluna_id];if(novo==null||novo===ultimo)throw Error('Verifique coluna_id');ultimo=novo;
 }
 return linhas;
}

    if (antes) detectarPremios(antes, dados);
    pintar();

    $('status').className = 'status live';
    $('status').textContent = 'Ao vivo';
    $('updated').textContent = 'Atualizado às ' +
      new Date().toLocaleTimeString('pt-BR', { timeZone: 'America/Belem' });
  } catch (erro) {
    $('status').className = 'status';
    $('status').textContent = dados
      ? 'Atualização falhou · dados anteriores'
      : 'Falha ao consultar o placar';
        console.error('Painel comercial:', erro);
  } finally {
    setTimeout(atualizar, 30000);
  }
}

relogio();
setInterval(relogio, 1000);
window.addEventListener('resize', pintar);

setInterval(() => {
  if (dados && dados.grupos.some(grupo => grupo.length > capacidade())) {
    paginas = paginas.map(pagina => pagina + 1);
    pintar();
  }
}, 12000);

$('full').onclick = async () => {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else {
      await document.documentElement.requestFullscreen();
    }
  } catch {
    $('full').textContent = 'Use F11';
  }
};

document.addEventListener('fullscreenchange', () => {
  $('full').textContent = document.fullscreenElement
    ? '⛶ Sair da tela cheia'
    : '⛶ Tela cheia';
});

if (MODO_TESTE) {
  mostrar(exemplo());
  $('status').textContent = 'Modo demonstração';
  $('updated').textContent = 'Dados fictícios';
} else {
  atualizar();
}
</script>
</body>
</html>
